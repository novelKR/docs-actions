# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install the version-pinned CI-only YAML parser
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Validate the deployment contract and negative cases
        run: python -B -m unittest discover -s tests -v
      - name: Inspect all workflow YAML and maintained documentation links
        run: python -B scripts/check_contract.py
